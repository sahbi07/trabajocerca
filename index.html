<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrabajoCerca</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #0b7a4b;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .search h2 {
      margin-bottom: 15px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0b7a4b;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #09643e;
    }

    .job {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .job h3 {
      margin-bottom: 8px;
    }

    .job p {
      margin: 6px 0;
      color: #555;
    }

    .badge {
      display: inline-block;
      background: #e4f5ed;
      color: #0b7a4b;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 8px;
    }

    #mensaje {
      text-align: center;
      margin: 20px 0;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>TrabajoCerca</h1>
  <p>Encuentra trabajo cerca de ti</p>
</header>

<div class="container">

  <div class="search">
    <h2>🔎 Buscar trabajo</h2>

    <input id="trabajo" type="text" placeholder="¿Qué trabajo buscas?">

    <input id="localidad" type="text" placeholder="📍 Localidad">

    <select id="sector">
      <option value="">Todos los sectores</option>
      <option value="agricultura">Agricultura</option>
      <option value="almacén">Almacén</option>
      <option value="construcción">Construcción</option>
      <option value="hostelería">Hostelería</option>
      <option value="limpieza">Limpieza</option>
    </select>

    <button onclick="buscarOfertas()">Buscar ofertas</button>
  </div>

  <h2>Últimas ofertas</h2>

  <br>

  <div id="ofertas">

    <div class="job" data-trabajo="trabajador agrícola" data-localidad="lorca murcia" data-sector="agricultura">
      <h3>👨‍🌾 Trabajador agrícola</h3>
      <p>📍 Lorca, Murcia</p>
      <p>💰 8,50 €/hora</p>
      <p>🕐 Jornada completa</p>
      <span class="badge">Agricultura</span>
    </div>

    <div class="job" data-trabajo="mozo de almacén" data-localidad="puerto lumbreras murcia" data-sector="almacén">
      <h3>📦 Mozo de almacén</h3>
      <p>📍 Puerto Lumbreras, Murcia</p>
      <p>💰 1.300 €/mes</p>
      <p>🕐 Jornada completa</p>
      <span class="badge">Almacén</span>
    </div>

  </div>

  <p id="mensaje"></p>

</div>

<script>

function buscarOfertas() {

  const trabajo = document.getElementById("trabajo").value.toLowerCase().trim();
  const localidad = document.getElementById("localidad").value.toLowerCase().trim();
  const sector = document.getElementById("sector").value.toLowerCase();

  const ofertas = document.querySelectorAll(".job");

  let encontradas = 0;

  ofertas.forEach(function(oferta) {

    const textoTrabajo = oferta.dataset.trabajo;
    const textoLocalidad = oferta.dataset.localidad;
    const textoSector = oferta.dataset.sector;

    const coincideTrabajo =
      trabajo === "" || textoTrabajo.includes(trabajo);

    const coincideLocalidad =
      localidad === "" || textoLocalidad.includes(localidad);

    const coincideSector =
      sector === "" || textoSector === sector;

    if (coincideTrabajo && coincideLocalidad && coincideSector) {
      oferta.style.display = "block";
      encontradas++;
    } else {
      oferta.style.display = "none";
    }

  });

  const mensaje = document.getElementById("mensaje");

  if (encontradas === 0) {
    mensaje.textContent = "❌ No hemos encontrado ofertas con esos filtros.";
  } else {
    mensaje.textContent = "✅ " + encontradas + " oferta(s) encontrada(s).";
  }
}

</script>

</body>
</html>
