<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrabajoCerca</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #0b7a4b;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 16px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .search h2 {
      margin-bottom: 15px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0b7a4b;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      cursor: pointer;
    }

    .job {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .job h3 {
      margin-bottom: 8px;
    }

    .job p {
      margin: 6px 0;
      color: #555;
    }

    .badge {
      display: inline-block;
      background: #e4f5ed;
      color: #0b7a4b;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1>TrabajoCerca</h1>
  <p>Encuentra trabajo cerca de ti</p>
</header>

<div class="container">

  <div class="search">
    <h2>🔎 Buscar trabajo</h2>

    <input type="text" placeholder="¿Qué trabajo buscas?">

    <input type="text" placeholder="📍 Localidad">

    <select>
      <option value="">Todos los sectores</option>
      <option>Agricultura</option>
      <option>Almacén</option>
      <option>Construcción</option>
      <option>Hostelería</option>
      <option>Limpieza</option>
      <option>Otros</option>
    </select>

    <button>Buscar ofertas</button>
  </div>

  <h2>Últimas ofertas</h2>

  <br>

  <div class="job">
    <h3>👨‍🌾 Trabajador agrícola</h3>
    <p>📍 Lorca, Murcia</p>
    <p>💰 8,50 €/hora</p>
    <p>🕐 Jornada completa</p>
    <span class="badge">Agricultura</span>
  </div>

  <div class="job">
    <h3>📦 Mozo de almacén</h3>
    <p>📍 Puerto Lumbreras, Murcia</p>
    <p>💰 1.300 €/mes</p>
    <p>🕐 Jornada completa</p>
    <span class="badge">Almacén</span>
  </div>

</div>

</body>
</html>
